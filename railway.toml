[build]
builder = "nixpacks"

[deploy]
startCommand = "bash start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Add this section to disable route caching during build
[nixpacks]
phases.setup = ["apt-get update && apt-get install -y php8.3-cli php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-pgsql"]
phases.install = ["composer install --optimize-autoloader --no-dev", "npm ci && npm run build"]
phases.build = []  # Empty build phase skips route:cache